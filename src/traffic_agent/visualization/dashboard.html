<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚦 LLM Traffic Controller — Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --yellow: #d29922; --red: #f85149;
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  .header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 20px; }
  .header .status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-dim); }
  .header .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.connected { background: var(--green); } .dot.disconnected { background: var(--red); }
  .container { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr; gap: 16px; padding: 16px 24px; height: calc(100vh - 65px); }
  .metrics { grid-column: 1 / -1; display: flex; gap: 16px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; flex: 1; }
  .metric-card .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .metric-card .value { font-size: 32px; font-weight: 700; margin-top: 4px; }
  .metric-card .value.blue { color: var(--accent); } .metric-card .value.green { color: var(--green); }
  .metric-card .value.yellow { color: var(--yellow); } .metric-card .value.red { color: var(--red); }
  .main { display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
  .grid-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .grid-panel h3 { font-size: 14px; margin-bottom: 12px; color: var(--text-dim); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .intersection { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; text-align: center; transition: all 0.3s; }
  .intersection.thinking { border-color: var(--accent); box-shadow: 0 0 8px rgba(88,166,255,0.3); }
  .intersection .id { font-size: 11px; color: var(--text-dim); }
  .intersection .phase { font-size: 24px; margin: 4px 0; }
  .intersection .queue { font-size: 13px; color: var(--text-dim); }
  .timeline { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; flex: 1; overflow: hidden; }
  .timeline h3 { font-size: 14px; margin-bottom: 12px; color: var(--text-dim); }
  .timeline-bars { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; max-height: 200px; }
  .timeline-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .timeline-bar .label { width: 60px; text-align: right; color: var(--text-dim); flex-shrink: 0; }
  .timeline-bar .bar { height: 16px; border-radius: 3px; min-width: 2px; transition: width 0.3s; }
  .sidebar { display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
  .event-feed { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; flex: 1; overflow: hidden; }
  .event-feed h3 { font-size: 14px; margin-bottom: 12px; color: var(--text-dim); }
  .events { overflow-y: auto; max-height: calc(100vh - 300px); display: flex; flex-direction: column; gap: 6px; }
  .event { padding: 8px; border-radius: 4px; font-size: 12px; border-left: 3px solid; animation: slideIn 0.3s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  .event.thinking { border-color: var(--accent); background: rgba(88,166,255,0.08); }
  .event.decision { border-color: var(--green); background: rgba(63,185,80,0.08); }
  .event.conflict { border-color: var(--red); background: rgba(248,81,73,0.08); }
  .event.coordination { border-color: var(--purple); background: rgba(188,140,255,0.08); }
  .event .time { color: var(--text-dim); font-size: 11px; }
  .event .agent { font-weight: 600; }
  .controls { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .controls h3 { font-size: 14px; margin-bottom: 12px; color: var(--text-dim); }
  .controls button { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-bottom: 8px; transition: opacity 0.2s; }
  .controls button:hover { opacity: 0.85; }
  .btn-start { background: var(--green); color: #000; }
  .btn-stop { background: var(--red); color: #fff; }
  .btn-clear { background: var(--border); color: var(--text); }
</style>
</head>
<body>
<div class="header">
  <h1>🚦 LLM Traffic Controller</h1>
  <div class="status"><div class="dot disconnected" id="statusDot"></div><span id="statusText">Disconnected</span></div>
</div>
<div class="container">
  <div class="metrics">
    <div class="metric-card"><div class="label">Total Events</div><div class="value blue" id="mEvents">0</div></div>
    <div class="metric-card"><div class="label">Decisions</div><div class="value green" id="mDecisions">0</div></div>
    <div class="metric-card"><div class="label">Conflicts</div><div class="value red" id="mConflicts">0</div></div>
    <div class="metric-card"><div class="label">Avg Decision (ms)</div><div class="value yellow" id="mAvgMs">0</div></div>
  </div>
  <div class="main">
    <div class="grid-panel"><h3>3×3 INTERSECTION GRID</h3><div class="grid" id="grid"></div></div>
    <div class="timeline"><h3>DECISION TIMELINE</h3><div class="timeline-bars" id="timeline"></div></div>
  </div>
  <div class="sidebar">
    <div class="controls">
      <h3>SIMULATION CONTROL</h3>
      <button class="btn-start" id="btnStart" onclick="startSim()">▶ Start (50 steps)</button>
      <button class="btn-stop" id="btnStop" onclick="stopSim()" style="display:none">■ Stop</button>
      <button class="btn-clear" onclick="clearEvents()">🗑 Clear Feed</button>
    </div>
    <div class="event-feed"><h3>LIVE EVENT FEED</h3><div class="events" id="events"></div></div>
  </div>
</div>
<script>
const API = window.location.origin;
let es = null;
const state = { intersections: {}, events: [], metrics: {} };

// Initialize 3x3 grid
function initGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const id = `ix_${r}_${c}`;
      state.intersections[id] = { phase: '🟢', queue: 0 };
      const el = document.createElement('div');
      el.className = 'intersection';
      el.id = `ix-${id}`;
      el.innerHTML = `<div class="id">${id}</div><div class="phase" id="phase-${id}">🟢</div><div class="queue" id="queue-${id}">queue: 0</div>`;
      grid.appendChild(el);
    }
  }
}

function connect() {
  if (es) es.close();
  es = new EventSource(`${API}/api/events/stream`);
  es.onopen = () => {
    document.getElementById('statusDot').className = 'dot connected';
    document.getElementById('statusText').textContent = 'Connected';
  };
  es.onerror = () => {
    document.getElementById('statusDot').className = 'dot disconnected';
    document.getElementById('statusText').textContent = 'Disconnected';
  };
  ['thinking','decision','conflict','coordination','metrics','simulation_start','simulation_step','simulation_end'].forEach(t => {
    es.addEventListener(t, e => handleEvent(JSON.parse(e.data)));
  });
  es.addEventListener('keepalive', () => {});
}

function handleEvent(ev) {
  state.events.push(ev);
  if (state.events.length > 500) state.events.shift();

  // Update intersection visuals
  if (ev.agent_id && ev.agent_id.startsWith('ix_')) {
    const el = document.getElementById(`ix-${ev.agent_id}`);
    if (el) {
      if (ev.event_type === 'thinking') {
        el.classList.add('thinking');
        setTimeout(() => el.classList.remove('thinking'), 1500);
      }
      if (ev.event_type === 'decision' && ev.data.decision) {
        const phase = ev.data.decision.phase;
        const phaseEl = document.getElementById(`phase-${ev.agent_id}`);
        if (phaseEl && phase !== undefined) phaseEl.textContent = phase === 0 ? '🟢' : phase === 1 ? '🔴' : '🟡';
      }
    }
  }

  // Add to feed
  addEventToFeed(ev);

  // Update metrics
  if (ev.event_type === 'simulation_step' || ev.event_type === 'simulation_end') {
    fetchMetrics();
  }

  // Timeline
  if (ev.event_type === 'decision' && ev.duration_ms) {
    addTimelineBar(ev.agent_id, ev.duration_ms);
  }
}

function addEventToFeed(ev) {
  const feed = document.getElementById('events');
  const el = document.createElement('div');
  el.className = `event ${ev.event_type}`;
  const time = new Date(ev.timestamp * 1000).toLocaleTimeString();
  let detail = '';
  if (ev.data.thought) detail = ev.data.thought.substring(0, 80);
  else if (ev.data.decision) detail = `phase=${ev.data.decision.phase}`;
  else if (ev.data.conflict_type) detail = ev.data.conflict_type;
  else if (ev.data.message) detail = ev.data.message.substring(0, 60);
  else detail = JSON.stringify(ev.data).substring(0, 60);
  el.innerHTML = `<span class="time">${time}</span> <span class="agent">${ev.agent_id}</span> — ${detail}`;
  feed.prepend(el);
  if (feed.children.length > 100) feed.lastChild.remove();
}

function addTimelineBar(agent, ms) {
  const tl = document.getElementById('timeline');
  const el = document.createElement('div');
  el.className = 'timeline-bar';
  const width = Math.min(Math.max(ms * 2, 4), 250);
  const color = ms > 200 ? '#f85149' : ms > 100 ? '#d29922' : '#3fb950';
  el.innerHTML = `<span class="label">${agent}</span><div class="bar" style="width:${width}px;background:${color}"></div><span>${ms.toFixed(1)}ms</span>`;
  tl.prepend(el);
  if (tl.children.length > 50) tl.lastChild.remove();
}

async function fetchMetrics() {
  try {
    const r = await fetch(`${API}/api/events/metrics`);
    const m = await r.json();
    document.getElementById('mEvents').textContent = m.total_events;
    document.getElementById('mDecisions').textContent = m.total_decisions;
    document.getElementById('mConflicts').textContent = m.total_conflicts;
    document.getElementById('mAvgMs').textContent = m.avg_decision_ms;
  } catch {}
}

async function startSim() {
  try {
    await fetch(`${API}/api/simulation/start?steps=50&speed=2`, { method: 'POST' });
    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnStop').style.display = 'block';
  } catch (e) { alert('Failed to start: ' + e.message); }
}

async function stopSim() {
  try {
    await fetch(`${API}/api/simulation/stop`, { method: 'POST' });
    document.getElementById('btnStart').style.display = 'block';
    document.getElementById('btnStop').style.display = 'none';
  } catch {}
}

function clearEvents() {
  document.getElementById('events').innerHTML = '';
  document.getElementById('timeline').innerHTML = '';
}

initGrid();
connect();
setInterval(fetchMetrics, 5000);
</script>
</body>
</html>
