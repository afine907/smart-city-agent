<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏙️ 3D City — LLM Traffic Control</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#e0e0e0;font-family:'SF Pro Display','Inter',system-ui,sans-serif;overflow:hidden}
canvas{display:block}

/* Top HUD */
.hud-top{position:fixed;top:0;left:0;right:0;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(10,10,18,.95) 50%,transparent);z-index:20;pointer-events:none}
.hud-top *{pointer-events:auto}
.logo{display:flex;align-items:center;gap:12px}
.logo h1{font-size:16px;font-weight:700;letter-spacing:2px;background:linear-gradient(135deg,#00d4ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo .tag{font-size:9px;color:#555;letter-spacing:1px;border:1px solid #222;padding:2px 8px;border-radius:4px}
.status-pill{display:flex;align-items:center;gap:10px;padding:6px 16px;border-radius:24px;background:rgba(15,15,25,.9);border:1px solid #1a1a2e}
.dot{width:8px;height:8px;border-radius:50%;transition:.3s}
.dot.on{background:#00ff88;box-shadow:0 0 12px #00ff88}
.dot.off{background:#ff3366}
.dot.sim{background:#ffcc00;box-shadow:0 0 12px #ffcc00;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.status-text{font-size:11px;font-weight:600;letter-spacing:1px}

/* KPI Cards */
.kpi-row{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20}
.kpi{background:rgba(12,12,22,.92);border:1px solid #1a1a2e;border-radius:12px;padding:14px 20px;backdrop-filter:blur(16px);min-width:130px;text-align:center;transition:.3s}
.kpi:hover{border-color:#00d4ff30;transform:translateY(-2px)}
.kpi .label{font-size:8px;color:#555;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.kpi .value{font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .unit{font-size:10px;color:#555;margin-top:2px}
.c-cyan{color:#00d4ff}.c-green{color:#00ff88}.c-yellow{color:#ffcc00}.c-red{color:#ff3366}.c-purple{color:#bc8cff}

/* Side Panel — Decision Log */
.panel-left{position:fixed;top:90px;left:16px;width:280px;z-index:20}
.panel{background:rgba(12,12,22,.92);border:1px solid #1a1a2e;border-radius:12px;padding:14px;backdrop-filter:blur(16px);max-height:55vh;overflow-y:auto}
.panel::-webkit-scrollbar{width:3px}.panel::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
.panel h3{font-size:8px;color:#555;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;font-weight:600}
.log-entry{padding:6px 8px;border-radius:6px;font-size:10px;margin-bottom:4px;border-left:2px solid;animation:slideIn .3s}
@keyframes slideIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.log-entry.think{border-color:#00d4ff;background:rgba(0,212,255,.03)}
.log-entry.decide{border-color:#00ff88;background:rgba(0,255,136,.03)}
.log-entry.alert{border-color:#ff3366;background:rgba(255,51,102,.03)}
.log-ts{color:#444;margin-right:4px;font-variant-numeric:tabular-nums;font-size:9px}
.log-agent{color:#00d4ff;font-weight:700}

/* Side Panel — Intersection Info */
.panel-right{position:fixed;top:90px;right:16px;width:240px;z-index:20}
.signal-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.signal-card{background:rgba(20,20,35,.8);border:1px solid #1a1a2e;border-radius:8px;padding:10px;text-align:center}
.signal-card .name{font-size:9px;color:#555;letter-spacing:1px}
.signal-card .light{width:14px;height:14px;border-radius:50%;margin:6px auto 0;transition:.3s}
.signal-card .light.green{background:#00ff88;box-shadow:0 0 16px #00ff88}
.signal-card .light.red{background:#ff3366;box-shadow:0 0 16px #ff3366}
.signal-card .light.yellow{background:#ffcc00;box-shadow:0 0 16px #ffcc00}
.signal-card .q{font-size:18px;font-weight:800;margin-top:4px}

/* Bottom Timeline */
.timeline{position:fixed;bottom:0;left:0;right:0;padding:12px 28px;display:flex;align-items:center;gap:16px;background:linear-gradient(0deg,rgba(10,10,18,.95) 50%,transparent);z-index:20}
.tl-bar{flex:1;height:4px;background:#1a1a2e;border-radius:2px;position:relative;cursor:pointer}
.tl-fill{height:100%;background:linear-gradient(90deg,#00d4ff,#00ff88);border-radius:2px;transition:width .3s}
.tl-label{font-size:10px;color:#555;font-variant-numeric:tabular-nums;min-width:60px}

/* Controls */
.ctrl-group{display:flex;gap:6px}
.btn{padding:6px 14px;border:1px solid #222;border-radius:8px;background:transparent;color:#aaa;font-size:10px;font-family:inherit;cursor:pointer;transition:.2s;letter-spacing:.5px}
.btn:hover{border-color:#00d4ff;color:#00d4ff}
.btn.go{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000;border:none;font-weight:700}
.btn.go:hover{filter:brightness(1.1)}
.btn.stop{background:#ff3366;color:#fff;border:none}
select{padding:6px 10px;border:1px solid #222;border-radius:8px;background:#0f0f1a;color:#aaa;font-size:10px;font-family:inherit;cursor:pointer}
select:focus{outline:none;border-color:#00d4ff}

/* Camera presets */
.cam-btns{position:fixed;bottom:60px;right:16px;display:flex;flex-direction:column;gap:4px;z-index:20}
.cam-btn{padding:5px 10px;border:1px solid #1a1a2e;border-radius:6px;background:rgba(12,12,22,.9);color:#666;font-size:9px;cursor:pointer;transition:.2s;letter-spacing:.5px}
.cam-btn:hover{border-color:#00d4ff;color:#00d4ff}
.cam-btn.active{border-color:#00ff88;color:#00ff88}

/* Tooltip */
.tooltip{position:fixed;padding:10px 14px;background:rgba(12,12,22,.95);border:1px solid #00d4ff30;border-radius:8px;font-size:10px;z-index:30;pointer-events:none;backdrop-filter:blur(12px);display:none;max-width:200px}
.tooltip .tt-name{font-weight:700;color:#00d4ff;margin-bottom:4px}
.tooltip .tt-row{display:flex;justify-content:space-between;gap:12px;color:#888}
.tooltip .tt-val{color:#ccc;font-weight:600}

/* Loading */
.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a12;z-index:100}
.loading h2{font-size:18px;font-weight:700;letter-spacing:3px;background:linear-gradient(135deg,#00d4ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.loading .bar{width:200px;height:3px;background:#1a1a2e;border-radius:2px;overflow:hidden}
.loading .bar-fill{width:0%;height:100%;background:linear-gradient(90deg,#00d4ff,#00ff88);border-radius:2px;transition:width .3s}
.loading .status{font-size:10px;color:#555;margin-top:8px;letter-spacing:1px}
</style>
</head>
<body>

<div class="loading" id="loadingScreen">
  <h2>🏙️ INITIALIZING CITY</h2>
  <div class="bar"><div class="bar-fill" id="loadBar"></div></div>
  <div class="status" id="loadStatus">Loading Three.js...</div>
</div>

<div class="hud-top">
  <div class="logo">
    <h1>🚦 CITY TRAFFIC AI</h1>
    <span class="tag">LLM-POWERED</span>
  </div>
  <div class="status-pill">
    <div class="dot off" id="statusDot"></div>
    <span class="status-text" id="statusText">IDLE</span>
  </div>
</div>

<div class="kpi-row">
  <div class="kpi"><div class="label">Vehicles</div><div class="value c-cyan" id="kpiVehicles">0</div></div>
  <div class="kpi"><div class="label">Throughput</div><div class="value c-green" id="kpiThroughput">0</div><div class="unit">veh/min</div></div>
  <div class="kpi"><div class="label">Avg Wait</div><div class="value c-yellow" id="kpiWait">0s</div></div>
  <div class="kpi"><div class="label">Efficiency</div><div class="value c-purple" id="kpiEfficiency">0%</div></div>
  <div class="kpi"><div class="label">LLM Calls</div><div class="value c-cyan" id="kpiLLM">0</div></div>
</div>

<div class="panel-left">
  <div class="panel" id="logPanel">
    <h3>🧠 AI Decision Stream</h3>
    <div id="logList"></div>
  </div>
</div>

<div class="panel-right">
  <div class="panel">
    <h3>📊 Intersection Status</h3>
    <div class="signal-grid" id="signalGrid"></div>
  </div>
</div>

<div class="cam-btns">
  <div class="cam-btn active" data-cam="orbit">🎥 Orbit</div>
  <div class="cam-btn" data-cam="top">📐 Top Down</div>
  <div class="cam-btn" data-cam="street">🚗 Street View</div>
  <div class="cam-btn" data-cam="cinematic">🎬 Cinematic</div>
</div>

<div class="timeline">
  <span class="tl-label" id="tlStep">Step 0</span>
  <div class="tl-bar"><div class="tl-fill" id="tlFill" style="width:0%"></div></div>
  <div class="ctrl-group">
    <select id="presetSelect">
      <option value="shenzhen">🇨🇳 深圳 · 西丽留仙洞</option>
      <option value="wuhan">🇨🇳 武汉 · 光谷广场</option>
      <option value="manhattan">🇺🇸 纽约 · 时代广场</option>
    </select>
    <button class="btn go" id="btnStart" onclick="startSim()">▶ START</button>
    <button class="btn stop" id="btnStop" onclick="stopSim()" style="display:none">■ STOP</button>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// CONFIG
// ============================================================
const API = window.location.origin;
const C = {
  bg: 0x0a0a12,
  road: 0x1c1c2e,
  roadLine: 0x3a3a5a,
  roadYellow: 0xcc9900,
  sidewalk: 0x14141e,
  building: 0x181828,
  buildingEdge: 0x252540,
  greenLight: 0x00ff88,
  redLight: 0xff3366,
  yellowLight: 0xffcc00,
  ground: 0x0d0d16,
  grid: 0x151520,
  vehicleColors: [0x00d4ff, 0x00ff88, 0xffcc00, 0xff3366, 0xbc8cff, 0xff8844, 0x44ffdd, 0xff44aa, 0x88aaff, 0xffaa44],
};

// ============================================================
// STATE
// ============================================================
let scene, camera, renderer, controls, clock;
let networkData = null;
let vehicles3D = new Map();  // id -> {mesh, data}
let signalMeshes = new Map(); // ix_id -> {sphere, light}
let buildingMeshes = [];
let roadMeshes = [];
let simRunning = false;
let simStep = 0;
let totalSteps = 200;
let currentPhase = {};
let raycaster, mouse;
let hoveredObject = null;
let cinematicTime = 0;
let currentCamMode = 'orbit';

// Stats
let stats = { vehicles: 0, completed: 0, waitTime: 0, llmCalls: 0, startTime: 0 };

// ============================================================
// INIT THREE.JS
// ============================================================
function init() {
  const loadBar = document.getElementById('loadBar');
  const loadStatus = document.getElementById('loadStatus');

  loadBar.style.width = '10%';
  loadStatus.textContent = 'Creating scene...';

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(C.bg);
  scene.fog = new THREE.FogExp2(C.bg, 0.003);

  // Camera
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(150, 120, 150);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.8;
  document.body.prepend(renderer.domElement);

  loadBar.style.width = '20%';
  loadStatus.textContent = 'Setting up lights...';

  // Lights
  const ambientLight = new THREE.AmbientLight(0x303050, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0x8888cc, 0.4);
  dirLight.position.set(100, 200, 100);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.near = 10;
  dirLight.shadow.camera.far = 500;
  dirLight.shadow.camera.left = -200;
  dirLight.shadow.camera.right = 200;
  dirLight.shadow.camera.top = 200;
  dirLight.shadow.camera.bottom = -200;
  scene.add(dirLight);

  // Hemisphere light for sky color
  const hemiLight = new THREE.HemisphereLight(0x202040, 0x101020, 0.3);
  scene.add(hemiLight);

  loadBar.style.width = '30%';
  loadStatus.textContent = 'Building ground...';

  // Ground plane
  const groundGeo = new THREE.PlaneGeometry(1000, 1000);
  const groundMat = new THREE.MeshStandardMaterial({
    color: C.ground,
    roughness: 0.95,
    metalness: 0.0,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.1;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid helper
  const gridHelper = new THREE.GridHelper(500, 50, C.grid, C.grid);
  gridHelper.position.y = 0;
  gridHelper.material.opacity = 0.15;
  gridHelper.material.transparent = true;
  scene.add(gridHelper);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2.1;
  controls.minDistance = 20;
  controls.maxDistance = 500;

  // Raycaster for mouse interaction
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  clock = new THREE.Clock();

  loadBar.style.width = '40%';
  loadStatus.textContent = 'Loading city data...';

  // Events
  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('mousemove', onMouseMove);

  // Camera preset buttons
  document.querySelectorAll('.cam-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setCameraPreset(btn.dataset.cam);
    });
  });

  loadBar.style.width = '50%';
  loadStatus.textContent = 'Connecting to server...';

  // Load network data
  fetchNetwork().then(() => {
    loadBar.style.width = '100%';
    loadStatus.textContent = 'Ready!';
    setTimeout(() => {
      document.getElementById('loadingScreen').style.opacity = '0';
      setTimeout(() => document.getElementById('loadingScreen').style.display = 'none', 500);
    }, 300);
    animate();
  });
}

// ============================================================
// FETCH NETWORK TOPOLOGY
// ============================================================
async function fetchNetwork() {
  try {
    const resp = await fetch(`${API}/api/network`);
    networkData = await resp.json();
    if (networkData && networkData.intersections && Object.keys(networkData.intersections).length > 0) {
      buildCity();
    }
  } catch (e) {
    console.log('Network not available, will build on simulation start');
  }
}

// ============================================================
// BUILD 3D CITY
// ============================================================
function buildCity() {
  if (!networkData || !networkData.intersections) return;

  // Clear existing
  buildingMeshes.forEach(m => scene.remove(m));
  roadMeshes.forEach(m => scene.remove(m));
  signalMeshes.forEach((v, k) => { scene.remove(v.sphere); scene.remove(v.pole); });
  buildingMeshes = [];
  roadMeshes = [];
  signalMeshes.clear();

  const intersections = networkData.intersections;
  const segments = networkData.segments || {};
  const isOSM = networkData.type && networkData.type.startsWith('osm_');

  // Convert lat/lon to local coordinates
  let coords = {};
  if (isOSM) {
    // Project lat/lon to meters
    const lats = Object.values(intersections).map(ix => ix.lat);
    const lons = Object.values(intersections).map(ix => ix.lon);
    const centerLat = (Math.min(...lats) + Math.max(...lats)) / 2;
    const centerLon = (Math.min(...lons) + Math.max(...lons)) / 2;

    for (const [id, ix] of Object.entries(intersections)) {
      const x = (ix.lon - centerLon) * 111320 * Math.cos(centerLat * Math.PI / 180);
      const z = (ix.lat - centerLat) * 110540;
      coords[id] = { x, z };
    }
  } else {
    // Grid layout
    for (const [id, ix] of Object.entries(intersections)) {
      coords[id] = {
        x: (ix.col || 0) * 60 - 60,
        z: (ix.row || 0) * 60 - 60,
      };
    }
  }

  // Center the city
  const xs = Object.values(coords).map(c => c.x);
  const zs = Object.values(coords).map(c => c.z);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
  const cz = (Math.min(...zs) + Math.max(...zs)) / 2;
  for (const id in coords) {
    coords[id].x -= cx;
    coords[id].z -= cz;
  }

  // Draw roads
  const drawnRoads = new Set();
  for (const [segId, seg] of Object.entries(segments)) {
    const fromCoord = coords[seg.from];
    const toCoord = coords[seg.to];
    if (!fromCoord || !toCoord) continue;

    const key = [seg.from, seg.to].sort().join('-');
    if (drawnRoads.has(key)) continue;
    drawnRoads.add(key);

    const dx = toCoord.x - fromCoord.x;
    const dz = toCoord.z - fromCoord.z;
    const len = Math.sqrt(dx * dx + dz * dz);
    const angle = Math.atan2(dx, dz);

    // Road surface
    const roadWidth = 8;
    const roadGeo = new THREE.BoxGeometry(roadWidth, 0.15, len);
    const roadMat = new THREE.MeshStandardMaterial({
      color: C.road,
      roughness: 0.8,
      metalness: 0.1,
    });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.position.set(
      (fromCoord.x + toCoord.x) / 2,
      0.05,
      (fromCoord.z + toCoord.z) / 2
    );
    road.rotation.y = angle;
    road.receiveShadow = true;
    scene.add(road);
    roadMeshes.push(road);

    // Center line (yellow)
    const lineGeo = new THREE.BoxGeometry(0.15, 0.17, len);
    const lineMat = new THREE.MeshStandardMaterial({ color: C.roadYellow, emissive: C.roadYellow, emissiveIntensity: 0.2 });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.position.copy(road.position);
    line.position.y = 0.1;
    line.rotation.y = angle;
    scene.add(line);
    roadMeshes.push(line);

    // Lane dividers (dashed — approximated)
    for (const side of [-1, 1]) {
      const dashCount = Math.floor(len / 4);
      for (let i = 0; i < dashCount; i += 2) {
        const t = (i + 0.5) / dashCount;
        const dashGeo = new THREE.BoxGeometry(0.1, 0.17, 1.5);
        const dashMat = new THREE.MeshStandardMaterial({ color: C.roadLine, emissive: C.roadLine, emissiveIntensity: 0.1 });
        const dash = new THREE.Mesh(dashGeo, dashMat);
        dash.position.set(
          fromCoord.x + dx * t + Math.cos(angle) * side * 2,
          0.1,
          fromCoord.z + dz * t - Math.sin(angle) * side * 2
        );
        dash.rotation.y = angle;
        scene.add(dash);
        roadMeshes.push(dash);
      }
    }
  }

  // Draw intersections as flat discs
  for (const [id, c] of Object.entries(coords)) {
    const ixGeo = new THREE.CylinderGeometry(5, 5, 0.2, 32);
    const ixMat = new THREE.MeshStandardMaterial({
      color: 0x1a1a30,
      roughness: 0.7,
      metalness: 0.2,
    });
    const ixMesh = new THREE.Mesh(ixGeo, ixMat);
    ixMesh.position.set(c.x, 0.1, c.z);
    ixMesh.receiveShadow = true;
    scene.add(ixMesh);
    roadMeshes.push(ixMesh);

    // Signal pole
    const poleGeo = new THREE.CylinderGeometry(0.15, 0.15, 6, 8);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.8 });
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.set(c.x + 6, 3, c.z);
    pole.castShadow = true;
    scene.add(pole);

    // Signal light (sphere)
    const sigGeo = new THREE.SphereGeometry(1.2, 16, 16);
    const sigMat = new THREE.MeshStandardMaterial({
      color: C.redLight,
      emissive: C.redLight,
      emissiveIntensity: 0.8,
      transparent: true,
      opacity: 0.9,
    });
    const sig = new THREE.Mesh(sigGeo, sigMat);
    sig.position.set(c.x + 6, 6.5, c.z);
    sig.castShadow = false;
    scene.add(sig);

    // Signal glow
    const glowGeo = new THREE.SphereGeometry(2.5, 16, 16);
    const glowMat = new THREE.MeshBasicMaterial({
      color: C.redLight,
      transparent: true,
      opacity: 0.15,
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.copy(sig.position);
    scene.add(glow);

    signalMeshes.set(id, { sphere: sig, glow, pole, coord: c });
  }

  // Generate procedural buildings
  generateBuildings(coords, segments);

  // Position camera
  const extent = Math.max(
    Math.max(...xs) - Math.min(...xs),
    Math.max(...zs) - Math.min(...zs)
  );
  const camDist = extent * 1.5 + 50;
  camera.position.set(camDist * 0.6, camDist * 0.5, camDist * 0.6);
  controls.target.set(0, 0, 0);
  controls.update();

  // Update signal grid UI
  updateSignalGridUI();
}

// ============================================================
// PROCEDURAL BUILDINGS
// ============================================================
function generateBuildings(coords, segments) {
  // Find road segments to avoid placing buildings on roads
  const roadCells = new Set();
  for (const seg of Object.values(segments)) {
    const from = coords[seg.from];
    const to = coords[seg.to];
    if (!from || !to) continue;
    // Mark cells near roads
    const steps = 20;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const x = from.x + (to.x - from.x) * t;
      const z = from.z + (to.z - from.z) * t;
      for (let dx = -8; dx <= 8; dx += 4) {
        for (let dz = -8; dz <= 8; dz += 4) {
          roadCells.add(`${Math.round((x+dx)/8)},${Math.round((z+dz)/8)}`);
        }
      }
    }
  }

  // Also avoid intersection areas
  for (const c of Object.values(coords)) {
    for (let dx = -10; dx <= 10; dx += 4) {
      for (let dz = -10; dz <= 10; dz += 4) {
        roadCells.add(`${Math.round((c.x+dx)/8)},${Math.round((c.z+dz)/8)}`);
      }
    }
  }

  // Place buildings in empty areas
  const extent = 150;
  const rng = mulberry32(42);  // Deterministic RNG

  for (let x = -extent; x < extent; x += 10) {
    for (let z = -extent; z < extent; z += 10) {
      const cellKey = `${Math.round(x/8)},${Math.round(z/8)}`;
      if (roadCells.has(cellKey)) continue;

      // Random chance to place building
      if (rng() > 0.35) continue;

      const w = 4 + rng() * 6;
      const d = 4 + rng() * 6;
      const h = 3 + rng() * 25;

      // Taller buildings in center
      const distFromCenter = Math.sqrt(x * x + z * z);
      const heightMult = Math.max(0.3, 1 - distFromCenter / 200);
      const finalH = h * heightMult;

      const buildGeo = new THREE.BoxGeometry(w, finalH, d);
      const buildMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.6 + rng() * 0.1, 0.1, 0.08 + rng() * 0.05),
        roughness: 0.85,
        metalness: 0.15,
      });
      const building = new THREE.Mesh(buildGeo, buildMat);
      building.position.set(
        x + (rng() - 0.5) * 4,
        finalH / 2,
        z + (rng() - 0.5) * 4
      );
      building.castShadow = true;
      building.receiveShadow = true;
      scene.add(building);
      buildingMeshes.push(building);

      // Window lights (emissive dots)
      if (finalH > 8) {
        const windowGeo = new THREE.PlaneGeometry(w * 0.8, finalH * 0.7);
        const windowCanvas = document.createElement('canvas');
        windowCanvas.width = 64;
        windowCanvas.height = 128;
        const wctx = windowCanvas.getContext('2d');
        wctx.fillStyle = '#0a0a12';
        wctx.fillRect(0, 0, 64, 128);

        // Random lit windows
        for (let wx = 2; wx < 62; wx += 8) {
          for (let wy = 2; wy < 126; wy += 10) {
            if (rng() > 0.4) {
              const brightness = 30 + Math.floor(rng() * 40);
              wctx.fillStyle = `rgba(${brightness + 20}, ${brightness + 15}, ${brightness}, ${0.3 + rng() * 0.5})`;
              wctx.fillRect(wx, wy, 5, 7);
            }
          }
        }

        const windowTex = new THREE.CanvasTexture(windowCanvas);
        const windowMat = new THREE.MeshBasicMaterial({
          map: windowTex,
          transparent: true,
          opacity: 0.6,
          side: THREE.DoubleSide,
        });
        const windowMesh = new THREE.Mesh(windowGeo, windowMat);
        windowMesh.position.set(
          building.position.x + w / 2 + 0.05,
          finalH / 2,
          building.position.z
        );
        scene.add(windowMesh);
        buildingMeshes.push(windowMesh);

        // Back side windows
        const windowMesh2 = windowMesh.clone();
        windowMesh2.position.x = building.position.x - w / 2 - 0.05;
        scene.add(windowMesh2);
        buildingMeshes.push(windowMesh2);
      }
    }
  }
}

// Deterministic RNG
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

// ============================================================
// SSE CONNECTION
// ============================================================
let es = null;

function connectSSE() {
  if (es) es.close();
  es = new EventSource(`${API}/api/events/stream`);

  es.onopen = () => {
    document.getElementById('statusDot').className = 'dot on';
    document.getElementById('statusText').textContent = 'CONNECTED';
  };

  es.onerror = () => {
    document.getElementById('statusDot').className = 'dot off';
    document.getElementById('statusText').textContent = 'OFFLINE';
    es.close();
    setTimeout(connectSSE, 3000);
  };

  ['thinking', 'decision', 'conflict', 'simulation_start', 'simulation_step', 'simulation_end']
    .forEach(t => es.addEventListener(t, e => handleSSEEvent(JSON.parse(e.data))));
}

function handleSSEEvent(ev) {
  const data = ev.data || {};

  if (ev.event_type === 'decision' && data.decision) {
    addLogEntry('decide', ev.agent_id, `→ ${data.decision.phase}`);
    // Update signal
    const sig = signalMeshes.get(ev.agent_id);
    if (sig) {
      const phase = data.decision.phase;
      const isGreen = phase && !phase.includes('RED') && !phase.includes('YELLOW');
      const isYellow = phase && phase.includes('YELLOW');
      const color = isYellow ? C.yellowLight : isGreen ? C.greenLight : C.redLight;
      sig.sphere.material.color.setHex(color);
      sig.sphere.material.emissive.setHex(color);
      sig.glow.material.color.setHex(color);
      currentPhase[ev.agent_id] = phase;
    }
  }

  if (ev.event_type === 'thinking') {
    addLogEntry('think', ev.agent_id, (data.thought || '').substring(0, 60));
  }

  if (ev.event_type === 'conflict') {
    addLogEntry('alert', ev.agent_id, data.conflict_type || 'conflict');
  }

  if (ev.event_type === 'simulation_step') {
    simStep = data.step || simStep + 1;
    updateTimeline();
  }

  if (ev.event_type === 'simulation_end') {
    stopSim();
  }
}

// ============================================================
// VEHICLE MANAGEMENT
// ============================================================
function spawnVehicle3D(id, approach, lane, isEmergency = false) {
  const color = isEmergency ? 0xff3366 : C.vehicleColors[Math.floor(Math.random() * C.vehicleColors.length)];

  // Car body
  const bodyGeo = new THREE.BoxGeometry(1.8, 1.0, 3.5);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.3,
    metalness: 0.7,
    emissive: color,
    emissiveIntensity: 0.15,
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;

  // Roof (slightly smaller)
  const roofGeo = new THREE.BoxGeometry(1.4, 0.6, 1.8);
  const roofMat = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.3,
    metalness: 0.7,
  });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.y = 0.8;
  body.add(roof);

  // Headlights
  const hlGeo = new THREE.BoxGeometry(0.3, 0.2, 0.1);
  const hlMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.8 });
  const hl1 = new THREE.Mesh(hlGeo, hlMat);
  hl1.position.set(-0.6, 0, 1.8);
  body.add(hl1);
  const hl2 = new THREE.Mesh(hlGeo, hlMat);
  hl2.position.set(0.6, 0, 1.8);
  body.add(hl2);

  // Taillights
  const tlMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.5 });
  const tl1 = new THREE.Mesh(hlGeo, tlMat);
  tl1.position.set(-0.6, 0, -1.8);
  body.add(tl1);
  const tl2 = new THREE.Mesh(hlGeo, tlMat);
  tl2.position.set(0.6, 0, -1.8);
  body.add(tl2);

  if (isEmergency) {
    // Siren lights
    const sirenGeo = new THREE.BoxGeometry(0.8, 0.3, 0.3);
    const sirenMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, emissive: 0x4488ff, emissiveIntensity: 1 });
    const siren = new THREE.Mesh(sirenGeo, sirenMat);
    siren.position.y = 1.2;
    siren.userData.isSiren = true;
    body.add(siren);

    // Emergency glow
    const glowGeo = new THREE.SphereGeometry(3, 16, 16);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.1 });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.y = 1;
    body.add(glow);
  }

  scene.add(body);

  return {
    mesh: body,
    data: { id, approach, lane, t: 0, speed: 0.004 + Math.random() * 0.003, emergency: isEmergency },
  };
}

function updateVehiclePositions() {
  const isOSM = networkData && networkData.type && networkData.type.startsWith('osm_');

  for (const [id, v] of vehicles3D) {
    v.data.t += v.data.speed;
    if (v.data.t >= 1) {
      scene.remove(v.mesh);
      v.mesh.traverse(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      });
      vehicles3D.delete(id);
      stats.completed++;
      continue;
    }

    // Animate siren
    if (v.data.emergency) {
      v.mesh.traverse(child => {
        if (child.userData && child.userData.isSiren) {
          const phase = Math.floor(Date.now() / 200) % 2;
          child.material.color.setHex(phase ? 0x4488ff : 0xff3366);
          child.material.emissive.setHex(phase ? 0x4488ff : 0xff3366);
        }
      });
    }

    // Move along a random road segment
    // Simple: move in the direction based on approach
    const t = v.data.t;
    const dist = 100;
    switch (v.data.approach) {
      case 0: // North
        v.mesh.position.set(0, 0.6, -dist + t * dist * 2);
        v.mesh.rotation.y = 0;
        break;
      case 1: // East
        v.mesh.position.set(dist - t * dist * 2, 0.6, 0);
        v.mesh.rotation.y = Math.PI / 2;
        break;
      case 2: // South
        v.mesh.position.set(0, 0.6, dist - t * dist * 2);
        v.mesh.rotation.y = Math.PI;
        break;
      case 3: // West
        v.mesh.position.set(-dist + t * dist * 2, 0.6, 0);
        v.mesh.rotation.y = -Math.PI / 2;
        break;
    }
  }
}

// ============================================================
// CAMERA PRESETS
// ============================================================
function setCameraPreset(mode) {
  currentCamMode = mode;
  const duration = 1000;
  const start = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
  let target;

  switch (mode) {
    case 'orbit':
      target = { x: 150, y: 120, z: 150 };
      controls.target.set(0, 0, 0);
      break;
    case 'top':
      target = { x: 0, y: 250, z: 0.1 };
      controls.target.set(0, 0, 0);
      break;
    case 'street':
      target = { x: 5, y: 8, z: 5 };
      controls.target.set(0, 3, 0);
      break;
    case 'cinematic':
      cinematicTime = 0;
      return; // handled in animate
  }

  // Animate
  const startTime = Date.now();
  function animateCam() {
    const elapsed = Date.now() - startTime;
    const t = Math.min(1, elapsed / duration);
    const ease = 1 - Math.pow(1 - t, 3);

    camera.position.set(
      start.x + (target.x - start.x) * ease,
      start.y + (target.y - start.y) * ease,
      start.z + (target.z - start.z) * ease
    );
    controls.update();

    if (t < 1) requestAnimationFrame(animateCam);
  }
  animateCam();
}

// ============================================================
// MOUSE INTERACTION
// ============================================================
function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const allMeshes = [...signalMeshes.values()].map(v => v.sphere);
  const intersects = raycaster.intersectObjects(allMeshes);

  const tooltip = document.getElementById('tooltip');
  if (intersects.length > 0) {
    const hit = intersects[0].object;
    let ixId = null;
    for (const [id, v] of signalMeshes) {
      if (v.sphere === hit) { ixId = id; break; }
    }
    if (ixId) {
      const sig = signalMeshes.get(ixId);
      tooltip.style.display = 'block';
      tooltip.style.left = event.clientX + 12 + 'px';
      tooltip.style.top = event.clientY - 10 + 'px';
      tooltip.innerHTML = `
        <div class="tt-name">${ixId}</div>
        <div class="tt-row"><span>Phase</span><span class="tt-val">${currentPhase[ixId] || 'N/A'}</span></div>
        <div class="tt-row"><span>Position</span><span class="tt-val">(${sig.coord.x.toFixed(0)}, ${sig.coord.z.toFixed(0)})</span></div>
      `;
    }
  } else {
    tooltip.style.display = 'none';
  }
}

// ============================================================
// UI HELPERS
// ============================================================
function addLogEntry(type, agent, message) {
  const list = document.getElementById('logList');
  const el = document.createElement('div');
  el.className = `log-entry ${type}`;
  const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  el.innerHTML = `<span class="log-ts">${time}</span><span class="log-agent">${agent || 'sys'}</span> ${message}`;
  list.prepend(el);
  if (list.children.length > 50) list.lastChild.remove();
}

function updateTimeline() {
  const pct = totalSteps > 0 ? (simStep / totalSteps * 100) : 0;
  document.getElementById('tlFill').style.width = `${pct}%`;
  document.getElementById('tlStep').textContent = `Step ${simStep}/${totalSteps}`;
}

function updateKPIs() {
  const elapsed = stats.startTime > 0 ? (Date.now() - stats.startTime) / 1000 : 0;
  const throughput = elapsed > 0 ? (stats.completed / elapsed * 60).toFixed(1) : '0';

  document.getElementById('kpiVehicles').textContent = vehicles3D.size;
  document.getElementById('kpiThroughput').textContent = throughput;
  document.getElementById('kpiWait').textContent = (stats.completed > 0 ? (stats.waitTime / stats.completed).toFixed(1) : '0') + 's';
  document.getElementById('kpiEfficiency').textContent = stats.completed > 0 ?
    Math.min(100, Math.round(stats.completed / Math.max(1, stats.completed + vehicles3D.size) * 100)) + '%' : '0%';
  document.getElementById('kpiLLM').textContent = stats.llmCalls;
}

function updateSignalGridUI() {
  const grid = document.getElementById('signalGrid');
  if (!networkData || !networkData.intersections) return;

  grid.innerHTML = Object.keys(networkData.intersections).map(id => `
    <div class="signal-card">
      <div class="name">${id}</div>
      <div class="light red" id="sig_${id}"></div>
      <div class="q" id="q_${id}">0</div>
    </div>
  `).join('');
}

// ============================================================
// SIMULATION CONTROL
// ============================================================
window.startSim = async function() {
  const preset = document.getElementById('presetSelect').value;
  totalSteps = 200;

  try {
    await fetch(`${API}/api/simulation/start?steps=${totalSteps}&speed=2&preset=${preset}`, { method: 'POST' });
  } catch (e) {
    console.log('Server simulation start failed');
  }

  simRunning = true;
  simStep = 0;
  stats = { vehicles: 0, completed: 0, waitTime: 0, llmCalls: 0, startTime: Date.now() };
  vehicles3D.forEach(v => scene.remove(v.mesh));
  vehicles3D.clear();

  document.getElementById('statusDot').className = 'dot sim';
  document.getElementById('statusText').textContent = 'SIMULATING';
  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnStop').style.display = 'inline-block';

  // Spawn vehicles periodically
  if (window._spawnInterval) clearInterval(window._spawnInterval);
  window._spawnInterval = setInterval(() => {
    if (!simRunning) return;
    for (let a = 0; a < 4; a++) {
      if (Math.random() < 0.5) {
        const id = `v_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`;
        const v = spawnVehicle3D(id, a, 'through');
        vehicles3D.set(id, v);
      }
    }
    // Emergency
    if (Math.random() < 0.05) {
      const id = `ev_${Date.now()}`;
      const a = Math.floor(Math.random() * 4);
      const v = spawnVehicle3D(id, a, 'through', true);
      vehicles3D.set(id, v);
    }
  }, 500);
};

window.stopSim = async function() {
  try { await fetch(`${API}/api/simulation/stop`, { method: 'POST' }); } catch {}
  simRunning = false;
  if (window._spawnInterval) clearInterval(window._spawnInterval);

  document.getElementById('statusDot').className = 'dot on';
  document.getElementById('statusText').textContent = 'CONNECTED';
  document.getElementById('btnStart').style.display = 'inline-block';
  document.getElementById('btnStop').style.display = 'none';
};

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // Cinematic camera
  if (currentCamMode === 'cinematic') {
    cinematicTime += dt * 0.15;
    const r = 180;
    camera.position.set(
      Math.cos(cinematicTime) * r,
      80 + Math.sin(cinematicTime * 0.5) * 30,
      Math.sin(cinematicTime) * r
    );
    camera.lookAt(0, 10, 0);
  } else {
    controls.update();
  }

  // Update vehicles
  if (simRunning) {
    updateVehiclePositions();
    updateKPIs();
  }

  // Animate signal glow pulsing
  for (const [id, sig] of signalMeshes) {
    const pulse = Math.sin(Date.now() / 500 + Array.from(signalMeshes.keys()).indexOf(id)) * 0.05 + 0.15;
    sig.glow.material.opacity = pulse;
  }

  renderer.render(scene, camera);
}

// ============================================================
// RESIZE
// ============================================================
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ============================================================
// CONNECT
// ============================================================
init();
connectSSE();
</script>
